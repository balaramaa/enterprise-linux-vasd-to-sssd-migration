---
- name: Check clock skew against NTP/DC
  command: chronyc tracking
  register: ntp_check
  changed_when: false

- name: Snapshot last 60 days of AD identities for identity drift check
  shell: getent passwd | grep -E '^(uid|domain users)' > /var/tmp/pre_migration_passwd_snapshot.txt
  changed_when: false

- name: Verify existing VAS status
  command: /opt/quest/bin/vastool status
  register: vasd_status
  failed_when: vasd_status.rc != 0
