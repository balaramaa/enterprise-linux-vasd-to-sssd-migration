---
- name: Stop and disable VAS daemon (vasd)
  service:
    name: vasd
    state: stopped
    enabled: no

- name: Unconfigure VAS locally while preserving computer object
  command: /opt/quest/bin/vastool unjoin -f
  ignore_errors: yes

- name: Join domain via adcli preserving computer account (C2)
  command: adcli join --domain=corp.example.com --os-name="Red Hat Enterprise Linux" --os-version="{{ ansible_distribution_version }}"
  register: adcli_result
  failed_when: adcli_result.rc != 0
