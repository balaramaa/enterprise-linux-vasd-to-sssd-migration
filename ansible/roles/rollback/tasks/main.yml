---
- name: Stop and disable SSSD
  ansible.builtin.service:
    name: sssd
    state: stopped
    enabled: false
  failed_when: false

- name: Check for the pre-migration backup
  ansible.builtin.stat:
    path: "{{ migration_state_dir }}/pre-migration-auth.tar.gz"
  register: auth_backup

- name: Restore NSS, PAM, and Kerberos configuration
  ansible.builtin.command: "tar -xzf {{ migration_state_dir }}/pre-migration-auth.tar.gz -C /"
  when: auth_backup.stat.exists

- name: Rejoin VAS (adcli reset the machine password, so a restart is not enough)
  ansible.builtin.command: >-
    {{ vastool }} -u {{ vas_join_user }} -w {{ vas_join_password }}
    join -f {{ ad_domain }}
  no_log: true

- name: Start and enable the VAS daemon
  ansible.builtin.service:
    name: vasd
    state: started
    enabled: true

- name: Confirm VAS is healthy
  ansible.builtin.command: "{{ vastool }} status"
  changed_when: false

- name: Clear the verified marker
  ansible.builtin.file:
    path: "{{ migration_state_dir }}/VERIFIED"
    state: absent
