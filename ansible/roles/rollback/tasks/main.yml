---
- name: Restore authselect baseline profile
  command: authselect select sssd --force
  ignore_errors: yes

- name: Rejoin VAS environment
  command: /opt/quest/bin/vastool -u admin join -f corp.example.com
  register: vas_rejoin
  failed_when: vas_rejoin.rc != 0

- name: Restart VAS daemon
  service:
    name: vasd
    state: started
    enabled: yes
