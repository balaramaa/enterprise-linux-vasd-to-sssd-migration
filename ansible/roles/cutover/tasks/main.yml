---
- name: Atomically switch NSS and PAM profile via authselect (C5)
  command: authselect select sssd with-mkhomedir --force
  register: authselect_result
  failed_when: authselect_result.rc != 0

- name: Ensure default credential cache type preserves sessions (C3)
  lineinfile:
    path: /etc/krb5.conf
    regexp: '^default_ccache_name'
    line: 'default_ccache_name = FILE:/tmp/krb5cc_%{uid}'
  create: yes

- name: Start and enable SSSD service
  service:
    name: sssd
    state: started
    enabled: yes
