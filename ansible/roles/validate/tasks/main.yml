---
- name: Verify SSSD domain status
  command: sssctl domain-status corp.example.com
  register: sss_status
  failed_when: "'Active server' not in sss_status.stdout"

- name: Perform zero-tolerance identity diff check (C1)
  shell: |
    getent passwd > /var/tmp/post_migration_passwd_snapshot.txt
    diff /var/tmp/pre_migration_passwd_snapshot.txt /var/tmp/post_migration_passwd_snapshot.txt
  register: id_diff
  failed_when: id_diff.stdout != ""
