---
- name: Install SSSD, adcli, realmd, and authselect packages
  yum:
    name:
      - sssd
      - adcli
      - realmd
      - oddjob
      - oddjob-mkhomedir
      - authselect
    state: present

- name: Render sssd.conf with explicit POSIX mapping (C1)
  template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: '0600'
